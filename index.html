<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Elyana Magical Space</title>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background-color: #050505; overflow: hidden; font-family: 'Arial', sans-serif; }
        canvas { display: block; }
        .ui { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); z-index: 10; text-align: center; }
        button {
            padding: 18px 45px; background: transparent; color: #fff; border: 1px solid rgba(255,255,255,0.4);
            font-size: 1rem; cursor: pointer; border-radius: 5px; transition: all 0.5s; letter-spacing: 4px; text-transform: uppercase;
            backdrop-filter: blur(5px);
        }
        button:hover { background: #fff; color: #000; box-shadow: 0 0 50px rgba(255,255,255,0.6); }
        #bottom-text {
            position: absolute; bottom: 8%; width: 100%; text-align: center; color: rgba(255,255,255,0.7);
            font-size: 1.2rem; letter-spacing: 2px; opacity: 0; transition: opacity 4s;
        }
    </style>
</head>
<body>

    <div class="ui"><button id="btn">Initiate Universe</button></div>
    <div id="bottom-text">Every star shines for you, Elyana</div>
    <canvas id="canvas"></canvas>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const btn = document.getElementById('btn');
        const bottomText = document.getElementById('bottom-text');

        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        let particles = [];
        let transform = false;
        const mouse = { x: null, y: null, radius: 100 };

        window.addEventListener('mousemove', (e) => { mouse.x = e.x; mouse.y = e.y; });

        class Particle {
            constructor(x, y, targetX, targetY, color) {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.targetX = targetX;
                this.targetY = targetY;
                this.size = Math.random() * 2 + 0.5;
                this.color = color;
                this.baseX = this.x;
                this.baseY = this.y;
                this.density = (Math.random() * 30) + 1;
                this.angle = Math.random() * 360;
            }

            draw() {
                ctx.fillStyle = this.color;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
            }

            update() {
                if (transform) {
                    // حركة التجمع مع تأثير النبض
                    let pulse = Math.sin(Date.now() * 0.002) * 2;
                    let dx = (this.targetX + pulse) - this.x;
                    let dy = (this.targetY + pulse) - this.y;
                    this.x += dx * 0.06;
                    this.y += dy * 0.06;

                    // تفاعل مع الماوس بعد التجمع
                    let mdx = mouse.x - this.x;
                    let mdy = mouse.y - this.y;
                    let distance = Math.sqrt(mdx*mdx + mdy*mdy);
                    if (distance < mouse.radius) {
                        this.x -= mdx / 10;
                        this.y -= mdy / 10;
                    }
                } else {
                    // حركة عشوائية هادئة
                    this.x += Math.cos(this.angle) * 0.2;
                    this.y += Math.sin(this.angle) * 0.2;
                }
            }
        }

        function getPoints() {
            const tempCanvas = document.createElement('canvas');
            const tempCtx = tempCanvas.getContext('2d');
            tempCanvas.width = canvas.width;
            tempCanvas.height = canvas.height;
            const fSize = Math.min(canvas.width / 5, 180);
            tempCtx.font = `bold ${fSize}px Arial`;
            tempCtx.textAlign = 'center';
            tempCtx.textBaseline = 'middle';
            tempCtx.fillText("Elyana", canvas.width / 2, canvas.height / 2);

            const data = tempCtx.getImageData(0, 0, canvas.width, canvas.height).data;
            const pts = [];
            for (let y = 0; y < canvas.height; y += 4) {
                for (let x = 0; x < canvas.width; x += 4) {
                    if (data[(y * canvas.width + x) * 4 + 3] > 128) {
                        // ألوان متدرجة بناءً على المكان
                        let color = `hsl(${180 + (x/canvas.width)*100}, 80%, 70%)`;
                        pts.push({ x, y, color });
                    }
                }
            }
            return pts;
        }

        function init() {
            const pts = getPoints();
            particles = pts.map(p => new Particle(p.x, p.y, p.x, p.y, p.color));
        }

        function animate() {
            ctx.fillStyle = 'rgba(5, 5, 5, 0.15)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            particles.forEach(p => { p.update(); p.draw(); });
            requestAnimationFrame(animate);
        }

        btn.addEventListener('click', () => {
            transform = true;
            btn.style.opacity = '0';
            setTimeout(() => btn.style.display = 'none', 500);
            bottomText.style.opacity = '1';
        });

        init();
        animate();
        window.addEventListener('resize', () => { location.reload(); });
    </script>
</body>
</html>
