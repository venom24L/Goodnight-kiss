<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Will you give me a goodnight kiss?</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Canvas Confetti CDN -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Nunito:wght@600;800;900&display=swap');

        body {
            font-family: 'Fredoka', 'Nunito', sans-serif;
            background-color: #fde8ed;
            overflow-x: hidden;
            touch-action: manipulation;
        }

        /* Floating Hearts Animation */
        .hearts-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
            overflow: hidden;
        }

        .floating-heart {
            position: absolute;
            bottom: -50px;
            color: rgba(244, 114, 182, 0.45);
            animation: floatUp linear infinite;
            user-select: none;
        }

        @keyframes floatUp {
            0% {
                transform: translateY(0) scale(0.8) rotate(0deg);
                opacity: 0;
            }
            20% {
                opacity: 0.7;
            }
            80% {
                opacity: 0.7;
            }
            100% {
                transform: translateY(-110vh) scale(1.2) rotate(360deg);
                opacity: 0;
            }
        }

        /* Heartbeat Loader */
        .heartbeat-loader {
            animation: pulseHeart 1.2s infinite ease-in-out;
        }

        @keyframes pulseHeart {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.25); }
        }

        /* Smooth Growth Transitions */
        .btn-smooth {
            transition: all 0.4s cubic-bezier(0.25, 1, 0.5, 1);
        }

        .wiggle {
            animation: gentleWiggle 0.5s ease-in-out;
        }

        @keyframes gentleWiggle {
            0%, 100% { transform: rotate(0deg); }
            25% { transform: rotate(-5deg); }
            75% { transform: rotate(5deg); }
        }

        .yes-glow {
            box-shadow: 0 10px 30px rgba(34, 197, 94, 0.35);
        }

        /* Fade Page Transitions */
        .fade-exit {
            opacity: 0;
            transform: scale(0.96);
            transition: opacity 0.5s ease, transform 0.5s ease;
        }

        .fade-enter-active {
            opacity: 1;
            transform: scale(1);
            transition: opacity 0.6s ease, transform 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center relative p-4 select-none">

    <!-- PRELOADER OVERLAY -->
    <div id="preloader" class="fixed inset-0 z-50 bg-[#fde8ed] flex flex-col items-center justify-center transition-opacity duration-700">
        <div class="heartbeat-loader text-rose-500 mb-4">
            <svg class="w-16 h-16 fill-current" viewBox="0 0 24 24">
                <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
            </svg>
        </div>
        <p class="text-rose-900 font-bold text-lg tracking-wide">Preparing love...</p>
    </div>

    <!-- BACKGROUND FLOATING HEARTS -->
    <div id="heartsContainer" class="hearts-container"></div>

    <!-- MAIN CONTAINER -->
    <main id="appCard" class="w-full max-w-lg mx-auto flex flex-col items-center justify-center text-center z-10 min-h-[85vh] py-6 px-4">
        
        <!-- INITIAL STATE PAGE -->
        <div id="initialPage" class="w-full flex flex-col items-center justify-center space-y-6">
            
            <!-- INITIAL CHOICE IMAGE -->
            <div class="relative w-64 h-64 sm:w-72 sm:h-72 rounded-3xl overflow-hidden shadow-xl border-4 border-white/80 transform hover:scale-102 transition-transform duration-300">
                <img id="startImage" src="https://i.postimg.cc/brcWbfkq/12917973275cecaf2c2e6db29675f0b2.jpg" alt="Choice visual" class="w-full h-full object-cover">
            </div>

            <!-- QUESTION HEADER -->
            <h1 class="text-2xl sm:text-3xl md:text-4xl font-black text-rose-950 tracking-tight leading-snug px-2">
                Will you give me a goodnight kiss?
            </h1>

            <!-- BUTTONS CONTAINER -->
            <div id="buttonArea" class="relative w-full min-h-[160px] flex items-center justify-center gap-4 mt-2 px-2 flex-wrap">
                
                <!-- GREEN YES BUTTON -->
                <button id="yesBtn" onclick="handleYesClick()" class="btn-smooth bg-emerald-500 hover:bg-emerald-600 active:bg-emerald-700 text-white font-extrabold rounded-full px-8 py-3.5 text-xl shadow-lg yes-glow focus:outline-none z-20 flex items-center justify-center cursor-pointer whitespace-nowrap">
                    Yes
                </button>

                <!-- CRIMSON RED NO BUTTON -->
                <button id="noBtn" onclick="handleNoInteraction()" class="btn-smooth bg-rose-700 hover:bg-rose-800 active:bg-rose-900 text-white font-bold rounded-full px-6 py-2.5 text-base shadow-md focus:outline-none z-10 flex items-center justify-center cursor-pointer whitespace-nowrap">
                    No
                </button>

            </div>

        </div>

        <!-- SUCCESS STATE PAGE -->
        <div id="successPage" class="hidden w-full flex flex-col items-center justify-center space-y-6">
            
            <!-- JOYFUL HEADER -->
            <h1 class="text-3xl sm:text-4xl md:text-5xl font-black text-rose-900 tracking-tight leading-tight wiggle">
                Knew you would say yes!
            </h1>

            <!-- SUCCESS IMAGE -->
            <div class="relative w-68 h-68 sm:w-80 sm:h-80 rounded-3xl overflow-hidden shadow-2xl border-4 border-white/90 transform hover:scale-102 transition-transform duration-300">
                <img id="yesImage" src="https://i.postimg.cc/bYxFMM1r/c26646ca9bd0a682a8561a81a49290bf.jpg" alt="Celebration visual" class="w-full h-full object-cover">
            </div>

            <p class="text-rose-800/80 font-bold text-lg sm:text-xl pt-1">
                Sending you the sweetest warmth and goodnight kisses
            </p>

            <button onclick="resetPage()" class="mt-2 px-6 py-2.5 bg-white/80 hover:bg-white text-rose-700 font-bold rounded-full shadow-sm border border-rose-200 transition-all text-sm cursor-pointer hover:shadow-md">
                Ask again
            </button>

        </div>

    </main>

    <script>
        // Expanded sequence of pleading messages for gradual progression
        const noMessages = [
            "Are you sure?",
            "Really sure??",
            "Think about it again...",
            "Are you positive?",
            "Pookie please...",
            "Don't be so cold...",
            "If you say no, I will be really sad",
            "I will be very very sad...",
            "My heart is breaking...",
            "You're really doing this?",
            "Please reconsider...",
            "Okay last chance, say yes..."
        ];

        let clickCount = 0;
        let isSuccess = false;

        // Image Preloader logic to prevent page display before resources load
        const imageUrls = [
            "https://i.postimg.cc/brcWbfkq/12917973275cecaf2c2e6db29675f0b2.jpg",
            "https://i.postimg.cc/bYxFMM1r/c26646ca9bd0a682a8561a81a49290bf.jpg"
        ];

        function preloadImages() {
            const promises = imageUrls.map(url => {
                return new Promise((resolve) => {
                    const img = new Image();
                    img.src = url;
                    img.onload = resolve;
                    img.onerror = resolve; // Continue even if load fails to prevent hanging
                });
            });
            return Promise.all(promises);
        }

        // Initialize audio context for subtle clicks
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        let audioCtx = null;

        function initAudio() {
            if (!audioCtx) audioCtx = new AudioCtx();
        }

        function playPopSound() {
            try {
                initAudio();
                if (!audioCtx) return;
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(280 + (clickCount * 25), audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(500 + (clickCount * 30), audioCtx.currentTime + 0.08);
                gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.08);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.08);
            } catch (e) {}
        }

        function playVictorySound() {
            try {
                initAudio();
                if (!audioCtx) return;
                const now = audioCtx.currentTime;
                const notes = [523.25, 659.25, 783.99, 1046.50];
                notes.forEach((freq, idx) => {
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(freq, now + (idx * 0.1));
                    gain.gain.setValueAtTime(0.2, now + (idx * 0.1));
                    gain.gain.exponentialRampToValueAtTime(0.001, now + (idx * 0.1) + 0.3);
                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    osc.start(now + (idx * 0.1));
                    osc.stop(now + (idx * 0.1) + 0.3);
                });
            } catch (e) {}
        }

        function createBackgroundHearts() {
            const container = document.getElementById('heartsContainer');
            const heartCount = 18;
            for (let i = 0; i < heartCount; i++) {
                const heart = document.createElement('div');
                heart.className = 'floating-heart';
                heart.innerHTML = `
                    <svg class="fill-current" style="width: ${Math.random() * 20 + 16}px; height: ${Math.random() * 20 + 16}px;" viewBox="0 0 24 24">
                        <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
                    </svg>
                `;
                heart.style.left = `${Math.random() * 100}%`;
                heart.style.animationDuration = `${Math.random() * 6 + 6}s`;
                heart.style.animationDelay = `${Math.random() * 5}s`;
                container.appendChild(heart);
            }
        }

        // Handle interaction with NO button
        function handleNoInteraction() {
            if (isSuccess) return;

            playPopSound();

            const noBtn = document.getElementById('noBtn');
            const yesBtn = document.getElementById('yesBtn');

            // Change message step by step
            const messageIndex = Math.min(clickCount, noMessages.length - 1);
            noBtn.innerText = noMessages[messageIndex];

            clickCount++;

            // Gradual growth parameters for YES button
            const growthRate = 0.18; // Slowed down growth rate
            const maxClicks = 12;
            const progress = Math.min(clickCount / maxClicks, 1);

            // Padding and size scale up slowly across 12 steps
            const paddingX = 32 + (clickCount * 14);
            const paddingY = 14 + (clickCount * 8);
            const fontSize = 1.25 + (clickCount * 0.18);
            const scaleVal = 1 + (clickCount * growthRate);

            yesBtn.style.paddingLeft = `${paddingX}px`;
            yesBtn.style.paddingRight = `${paddingX}px`;
            yesBtn.style.paddingTop = `${paddingY}px`;
            yesBtn.style.paddingBottom = `${paddingY}px`;
            yesBtn.style.fontSize = `${fontSize}rem`;
            yesBtn.style.transform = `scale(${scaleVal})`;

            // Gradually fade and shrink NO button in later stages
            if (clickCount > 5) {
                const fadeProgress = (clickCount - 5) / (maxClicks - 5);
                noBtn.style.opacity = `${Math.max(1 - (fadeProgress * 0.6), 0.4)}`;
                noBtn.style.transform = `scale(${Math.max(1 - (fadeProgress * 0.3), 0.7)})`;
            }

            // Trigger slight wiggle animation
            noBtn.classList.remove('wiggle');
            void noBtn.offsetWidth;
            noBtn.classList.add('wiggle');
        }

        // Handle YES button click
        function handleYesClick() {
            if (isSuccess) return;
            isSuccess = true;

            playVictorySound();

            const initialPage = document.getElementById('initialPage');
            const successPage = document.getElementById('successPage');

            initialPage.classList.add('fade-exit');

            setTimeout(() => {
                initialPage.classList.add('hidden');
                successPage.classList.remove('hidden');
                successPage.classList.add('fade-enter-active');

                triggerConfetti();
            }, 450);
        }

        // Celebration confetti burst
        function triggerConfetti() {
            if (typeof confetti === 'function') {
                const count = 180;
                const defaults = {
                    origin: { y: 0.65 },
                    colors: ['#f43f5e', '#ec4899', '#f472b6', '#fbcfe8', '#fbbf24', '#ffffff']
                };

                function fire(particleRatio, opts) {
                    confetti(Object.assign({}, defaults, opts, {
                        particleCount: Math.floor(count * particleRatio)
                    }));
                }

                fire(0.25, { spread: 30, startVelocity: 50 });
                fire(0.2, { spread: 60 });
                fire(0.35, { spread: 100, decay: 0.91, scalar: 0.8 });
                fire(0.1, { spread: 120, startVelocity: 25, decay: 0.92, scalar: 1.2 });
            }
        }

        function resetPage() {
            clickCount = 0;
            isSuccess = false;

            const initialPage = document.getElementById('initialPage');
            const successPage = document.getElementById('successPage');
            const yesBtn = document.getElementById('yesBtn');
            const noBtn = document.getElementById('noBtn');

            yesBtn.style.transform = 'scale(1)';
            yesBtn.style.paddingLeft = '';
            yesBtn.style.paddingRight = '';
            yesBtn.style.paddingTop = '';
            yesBtn.style.paddingBottom = '';
            yesBtn.style.fontSize = '';

            noBtn.style.transform = 'scale(1)';
            noBtn.style.opacity = '1';
            noBtn.innerText = 'No';

            successPage.classList.add('hidden');
            successPage.classList.remove('fade-enter-active');
            initialPage.classList.remove('hidden', 'fade-exit');
        }

        // Wait for page load and image preloading before removing loader
        window.addEventListener('load', () => {
            createBackgroundHearts();
            preloadImages().then(() => {
                const preloader = document.getElementById('preloader');
                preloader.classList.add('opacity-0');
                setTimeout(() => {
                    preloader.style.display = 'none';
                }, 700);
            });
        });
    </script>
</body>
</html>
